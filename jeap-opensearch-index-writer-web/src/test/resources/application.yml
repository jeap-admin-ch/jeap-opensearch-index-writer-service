spring:
  application:
    name: jeap-opensearch-index-writer-it
  main:
    banner-mode: off
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.boot.security.oauth2.server.resource.autoconfigure.OAuth2ResourceServerAutoConfiguration
  security:
    oauth2:
      client:
        registration:
          search-item-provider:
            client-id: test-client
            client-secret: test-secret
            authorization-grant-type: client_credentials
            provider: search-item-provider
        provider:
          search-item-provider:
            token-uri: http://localhost:1/oauth/token

jeap:
  opensearch:
    indexwriter:
      connection:
        url: http://localhost:1  # overridden by @DynamicPropertySource in tests
      index-templates:
        default:
          number-of-shards: 1
          number-of-replicas: 0
          refresh-interval: "1s"
      maintenance:
        upsert-command-topic: it-upsert-search-item-command
        delete-command-topic: it-delete-search-item-command

logging:
  level:
    ch.admin.bit.jeap: INFO
